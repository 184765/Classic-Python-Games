name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        run: |
          python build_exe.py

      - name: Prepare release folder
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release'
          $gameDir = Join-Path $releaseDir 'ClassicPythonGames'
          New-Item -ItemType Directory -Path $gameDir -Force | Out-Null

          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'dist\ClassicPythonGames.exe') $gameDir -Force

          @'
Classic Python Games
===================

This is the Windows release for the Classic Python Games project.

How to run:
1. Extract this ZIP file.
2. Double-click ClassicPythonGames.exe to start the game.
3. If Windows blocks the app, click "More info" and then "Run anyway".

Included files:
- ClassicPythonGames.exe

Notes:
- This is a standalone executable.
- No installation is required.
'@ | Set-Content -Path (Join-Path $gameDir 'README.txt') -Encoding UTF8

      - name: Zip final release
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release'
          $gameDir = Join-Path $releaseDir 'ClassicPythonGames'
          $zipPath = Join-Path $releaseDir 'ClassicPythonGames-Windows.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $gameDir '*') -DestinationPath $zipPath -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassicPythonGames-Windows
          path: |
            release/ClassicPythonGames-Windows.zip
